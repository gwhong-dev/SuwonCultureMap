# =====================================================
#  테스트(test) 프로필 — CI·로컬 테스트용
#  MySQL·실제 비밀값 없이 돌도록 H2 메모리 DB + 가짜 키 사용
# =====================================================
app.base-url=http://localhost:8080

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# 가짜 값 (외부 API 는 호출하지 않음)
swcf.api.key.event=test-swcf-key
kakao.rest-api-key=test-kakao-id
kakao.client-secret=test-kakao-secret
google.client-id=test-google-id
google.client-secret=test-google-secret
naver.client-id=test-naver-id
naver.client-secret=test-naver-secret
