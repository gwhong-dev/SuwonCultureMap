<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>마이페이지 - 수원 문화 프로그램 지도</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
      }

      .page-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        padding: 2.25rem 2rem;
        width: 380px;
      }

      .page-card h1 {
        font-size: 1.2rem;
        margin: 0 0 0.25rem;
      }

      .member-id {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 1.5rem;
      }

      .section-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: #444;
        margin: 0 0 0.75rem;
      }

      .provider-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.625rem 0;
        border-bottom: 1px solid #eee;
      }
      .provider-row:last-child {
        border-bottom: none;
      }

      .provider-name {
        font-size: 0.95rem;
        font-weight: 600;
      }

      .linked-badge {
        font-size: 0.8rem;
        color: #03c75a;
        font-weight: 600;
      }

      .link-btn {
        padding: 0.375rem 0.75rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .link-btn.kakao {
        background: #fee500;
        color: #000;
      }
      .link-btn.google {
        background: #4a90d9;
        color: #fff;
      }
      .link-btn.naver {
        background: #03c75a;
        color: #fff;
      }

      .back-link {
        display: inline-block;
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: #888;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page-card">
      <h1>마이페이지</h1>
      <div class="member-id" id="memberIdText">회원 정보 불러오는 중...</div>

      <div class="section-title">연동된 소셜 계정</div>
      <div id="providerList"></div>

      <a class="back-link" href="index.html">← 지도로 돌아가기</a>
    </div>

    <script>
      // ===== 3개 소셜 제공자 정보 (login.html과 동일한 인증 URL 재사용) =====
      var PROVIDERS = [
        {
          key: "kakao",
          label: "카카오",
          authUrl:
            "https://kauth.kakao.com/oauth/authorize?client_id=e9da4327b7be240f13ddd639379fe1fc&redirect_uri=http://localhost:8080/api/auth/kakao/callback&response_type=code",
        },
        {
          key: "google",
          label: "구글",
          authUrl:
            "https://accounts.google.com/o/oauth2/v2/auth?client_id=440681864198-k826a7epdj47stfnp7omhufp6rm7dbg7.apps.googleusercontent.com&redirect_uri=http://localhost:8080/api/auth/google/callback&response_type=code&scope=email%20profile",
        },
        {
          key: "naver",
          label: "네이버",
          authUrl:
            "https://nid.naver.com/oauth2.0/authorize?response_type=code&client_id=Q7X7EYInh1P5DiiyuSy0&redirect_uri=http://localhost:8080/api/auth/naver/callback&state=test123",
        },
      ];

      // ===== 로그인 상태 확인 후 연동된 소셜 목록 렌더링 =====
      fetch("/api/auth/me")
        .then((r) => r.json())
        .then(function (data) {
          if (!data.loggedIn) {
            // 로그인 안 한 상태로 마이페이지 접근 시 로그인 화면으로 이동
            window.location.href = "login.html";
            return;
          }

          document.getElementById("memberIdText").textContent =
            "회원 번호: " + data.memberId;

          var linkedProviders = data.linkedProviders || [];
          var list = document.getElementById("providerList");

          PROVIDERS.forEach(function (provider) {
            var row = document.createElement("div");
            row.className = "provider-row";

            var isLinked = linkedProviders.includes(provider.key);

            row.innerHTML =
              '<span class="provider-name">' + provider.label + "</span>" +
              (isLinked
                ? '<span class="linked-badge">✓ 연동됨</span>'
                : '<a class="link-btn ' +
                  provider.key +
                  '" href="' +
                  provider.authUrl +
                  '">연동하기</a>');

            list.appendChild(row);
          });
        });
    </script>
  </body>
</html>
