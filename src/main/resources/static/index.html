<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일에서 PC 화면을 축소해서 보여주지 않고, 기기 폭 그대로 그리게 함 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>수원바이블</title>
    <!-- 모바일(1024px 이하)에서만 Noto Sans KR 글꼴을 내려받음 (PC 는 기존 글꼴 유지) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="(max-width: 1024px)"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <div id="topbar">
      <select id="categorySelect">
        <option value="all">전체 카테고리</option>
      </select>
      <select id="dateFilter" aria-label="진행 날짜">
        <option value="all">전체 날짜</option>
        <option value="today">오늘 진행</option>
        <option value="weekend">이번 주말</option>
      </select>
      <input type="text" id="searchInput" placeholder="행사 이름 검색" enterkeyhint="search" />
      <label class="past-toggle">
        <input type="checkbox" id="showPastCheckbox" />
        지난 행사 보기
      </label>
      <div id="topbarActions">
        <span id="authStatus">로그인 확인 중...</span>
        <a id="loginPageBtn" class="login-btn login" href="login.html">로그인</a>
        <a id="mypageBtn" class="login-btn login" href="mypage.html">마이페이지</a>
        <button id="logoutBtn" class="login-btn logout">
          로그아웃
        </button>
        <a class="login-btn login" href="about.html">서비스 안내</a>
        <a class="login-btn login" href="privacy.html">개인정보 처리방침</a>
      </div>
      <!-- 모바일 전용: ☰ 메뉴 버튼 + 카테고리 칩 -->
      <button id="mobileMenuBtn" type="button" aria-label="메뉴">☰</button>
      <div id="categoryChips"></div>
    </div>

    <div id="app">
      <div id="map"></div>
      <button id="sidebarToggleBtn">›</button>
      <aside id="sidebar">
        <!-- 모바일 전용: 바텀시트 손잡이 + 결과 개수 (끌어올리기) -->
        <!-- 바 전체가 버튼: 탭 · 끌기 · 키보드(Enter · Space) -->
        <div id="sheetHeader" role="button" tabindex="0" aria-expanded="false" aria-label="행사 불러오는 중">
          <div class="sheet-handle"></div>
          <div class="sheet-bar">
            <span id="resultCount">행사 불러오는 중…</span>
            <span id="sheetToggle">
              <span id="sheetToggleText">목록 보기</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
            </span>
          </div>
        </div>
        <div id="list"></div>
      </aside>
      <!-- 모바일 전용: 마커 탭 시 하단 카드 ("가까운 순 · 1 / N" + 좌우로 넘기는 카드) -->
      <div id="previewArea">
        <span id="previewLabel"></span>
        <div id="previewStrip"></div>
      </div>
    </div>
    <!-- 모바일 전용: 하단 탭 (docs/design/mobile-design-v1.md 2번). 홈 탭은 홈 화면(01)이 생길 때 추가 -->
    <nav id="tabBar" aria-label="하단 탭">
      <button type="button" class="tab-item" data-tab="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" /><path d="M9 4v14M15 6v14" /></svg>
        <span>지도</span>
      </button>
      <button type="button" class="tab-item" data-tab="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        <span>목록</span>
      </button>
      <button type="button" class="tab-item" data-tab="fav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
        <span>찜</span>
      </button>
      <a class="tab-item" data-tab="my" href="mypage.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg>
        <span>마이</span>
      </a>
    </nav>

    <!-- ===== 모바일 전용: 길찾기 창 (하단 시트) + 토스트 ===== -->
    <div id="routeSheet" hidden>
      <section class="route-sheet" role="dialog" aria-modal="true" aria-labelledby="routeTitle">
        <span class="sheet-handle" aria-hidden="true"></span>
        <div class="route-head">
          <h2 id="routeTitle">길찾기</h2>
          <button id="routeCloseBtn" type="button" class="icon-btn" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="route-place">
          <span id="routeEvent" class="route-event"></span>
          <span id="routePlace" class="route-name"></span>
          <div class="route-addr-row">
            <span id="routeAddress" class="route-addr"></span>
            <button id="routeCopyBtn" type="button" class="copy-btn">주소 복사</button>
          </div>
        </div>
        <div class="route-links">
          <a id="routeKakao" class="route-link" href="#" target="_blank" rel="noopener">
            <span class="route-icon" aria-hidden="true">K</span>
            <span class="route-link-text">카카오맵에서 길찾기</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <a id="routeNaver" class="route-link" href="#" target="_blank" rel="noopener">
            <span class="route-icon" aria-hidden="true">N</span>
            <span class="route-link-text">네이버 지도에서 길찾기</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <a id="routeGoogle" class="route-link google" href="#" target="_blank" rel="noopener">
            <span class="route-icon" aria-hidden="true">G</span>
            <span class="route-link-text">
              <span lang="en">Google Maps</span>
              <small>대중교통 길찾기만 지원 (도보·자동차 미지원)</small>
            </span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <span class="route-note">앱이 설치되어 있지 않으면 웹 지도가 열려요</span>
        </div>
        <div class="route-cancel">
          <button id="routeCancelBtn" type="button">취소</button>
        </div>
      </section>
    </div>
    <!-- 모바일 전용: 공유 창 (카카오톡으로 보내기 · 링크 복사) -->
    <div id="shareSheet" hidden>
      <section class="route-sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <span class="sheet-handle" aria-hidden="true"></span>
        <div class="route-head">
          <h2 id="shareTitle">공유</h2>
          <button id="shareCloseBtn" type="button" class="icon-btn" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="route-place">
          <span id="shareEvent" class="route-event"></span>
        </div>
        <div class="route-links">
          <button id="shareKakaoBtn" type="button" class="route-link">
            <span class="route-icon kakao" aria-hidden="true">K</span>
            <span class="route-link-text">카카오톡으로 보내기</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
          <button id="shareCopyBtn" type="button" class="route-link">
            <span class="route-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1" /><path d="M5 15V5a1 1 0 0 1 1-1h10" /></svg>
            </span>
            <span class="route-link-text">링크 복사</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>
        <div class="route-cancel">
          <button id="shareCancelBtn" type="button">취소</button>
        </div>
      </section>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toastText"></span>
      <button id="toastAction" type="button" hidden></button>
    </div>

    <!-- ===== 상세정보 큰 팝업창 ===== -->
    <div id="detailModal" class="modal-overlay">
      <div class="modal-card">
        <button id="modalCloseBtn" class="modal-close">×</button>
        <!-- 모바일 전용 상단: 뒤로 · 공유(하단 창) · ♡ -->
        <header id="detailHead">
          <button id="detailBackBtn" type="button" class="icon-btn" aria-label="뒤로">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <div class="head-actions">
            <button id="detailShareBtn" type="button" class="icon-btn" aria-label="공유">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path d="M8.6 10.7l6.8-4.4M8.6 13.3l6.8 4.4" /></svg>
            </button>
            <button id="detailHeadFav" type="button" class="icon-btn" aria-label="찜하기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg></button>
          </div>
        </header>
        <img id="modalImage" class="modal-image" src="" alt="" />
        <div class="modal-body">
          <div id="modalFavBadge" class="modal-fav-badge" hidden>★ 찜한 행사</div>
          <div id="modalDate" class="modal-date"></div>
          <div id="detailMeta"></div>
          <h2 id="modalTitle" class="modal-title"></h2>
          <div id="modalBadges"></div>
          <!-- 모바일 전용: 고정 탭 (정보 | 주변) + 정보 표 -->
          <div id="detailTabs" role="tablist" aria-label="상세 탭">
            <button type="button" class="detail-tab active" data-target="detailRows" role="tab" aria-selected="true">정보</button>
            <button type="button" class="detail-tab" data-target="detailLocation" role="tab" aria-selected="false">주변</button>
          </div>
          <div id="modalSchedule" class="modal-schedule"></div>
          <div id="modalInfo" class="modal-info"></div>
          <dl id="detailRows"></dl>
          <!-- 진행 날짜가 정해진 여러 날 행사: 캘린더에 넣을 날짜 하나를 고름 -->
          <label id="modalCalDateWrap" class="modal-cal-date" hidden>
            캘린더에 넣을 날짜
            <select id="modalCalDate"></select>
          </label>
          <!-- 아이폰 외(PC · 안드로이드): 📅 은 구글 캘린더, 다른 캘린더 앱은 .ics 파일로 -->
          <a id="modalIcsAltLink" class="modal-ics-alt" href="#" hidden>다른 캘린더 앱에 넣기 (.ics 파일)</a>
          <div class="modal-actions">
            <button id="modalFavoriteBtn" class="favorite-btn">☆ 즐겨찾기</button>
            <a id="modalCalBtn" class="modal-link-btn" href="#">📅 캘린더</a>
            <a id="modalLinkBtn" class="modal-link-btn" href="#" target="_blank" rel="noopener">원문 보기 →</a>
          </div>
          <!-- 모바일 전용: 소개(3줄 + 더보기) · 위치(작은 지도 + 주소 복사) -->
          <section id="detailIntro" class="detail-section">
            <h3>소개</h3>
            <p id="detailIntroText"></p>
            <button id="detailIntroMore" type="button" aria-expanded="false" hidden>더보기</button>
          </section>
          <section id="detailLocation" class="detail-section">
            <h3>위치</h3>
            <div id="modalMap" aria-hidden="true"></div>
            <div class="route-addr-row">
              <span id="detailAddress" class="route-addr"></span>
              <button id="detailCopyBtn" type="button" class="copy-btn">주소 복사</button>
            </div>
          </section>
        </div>
        <!-- 모바일 전용 하단 고정: ♡ + 길찾기 -->
        <div id="detailBar">
          <button id="detailFavBtn" type="button" aria-label="찜하기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg></button>
          <button id="detailRouteBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2z" /></svg>길찾기
          </button>
        </div>
      </div>
    </div>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7e3b2a42df77bc183241db2bcc6c3cbb&autoload=false"></script>
    <!-- 카카오톡 공유용 JS SDK (지도와 같은 JavaScript 키로 Kakao.init). 못 불러오면 공유 창에서 안내만 -->
    <!-- integrity: 카카오 문서(JavaScript > 다운로드)의 2.7.9 SRI 해시. 파일이 바뀌면 브라우저가 실행하지 않음 → 버전을 올릴 땐 해시도 같이 -->
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.9/kakao.min.js"
      integrity="sha384-JpLApTkB8lPskhVMhT+m5Ln8aHlnS0bsIexhaak0jOhAkMYedQoVghPfSpjNi9K1"
      crossorigin="anonymous"
    ></script>
    <script src="/schedule-format.js"></script>
    <script src="/route-links.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
