<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일에서 PC 화면을 축소해서 보여주지 않고, 기기 폭 그대로 그리게 함 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>수원바이블 · 수원 문화지도</title>
    <meta name="description" content="수원바이블 · 수원 문화지도 — 수원의 공연 · 전시 · 축제를 지도에서 한눈에" />
    <meta name="theme-color" content="#b4472a" />
    <!-- 브랜드 아이콘 (static/brand). 크롬 · 엣지 = svg, 사파리 · 옛 브라우저 = png · ico -->
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/manifest.json" />
    <!-- 링크 공유 미리보기 (카카오톡 · 메신저 · SNS). 이미지는 절대 주소 필요 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="수원바이블 · 수원 문화지도" />
    <meta property="og:title" content="수원바이블 · 수원 문화지도" />
    <meta property="og:description" content="수원의 공연 · 전시 · 축제를 지도에서 한눈에" />
    <meta property="og:url" content="https://suwonbible.com/" />
    <meta property="og:image" content="https://suwonbible.com/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 본문 글꼴(Pretendard 보통 굵기)을 CSS 보다 먼저 받기 시작 → 글꼴 바뀜 깜빡임 줄임 -->
    <link rel="preload" href="/brand/fonts/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin />
    <!-- 화면 모드: css 보다 먼저 동기로 읽어 첫 그리기 전에 <html data-theme> 설정 (깜빡임 방지) -->
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <div id="topbar">
      <!-- PC 전용 로고: 낙관(도장 "수원" + 지도 핀) + 워드마크 "수원바이블" / 아래 줄 부제. 글자는 윤곽(path) — static/brand/logo.svg (scripts/brand) -->
      <a class="topbar-brand" href="/" aria-label="수원바이블 · 수원 문화지도">
        <svg class="brand-seal" aria-hidden="true"><use href="/brand/logo.svg#seal-sm" /></svg>
        <span class="brand-words" aria-hidden="true"><svg class="brand-name"><use href="/brand/logo.svg#wordmark" /></svg><svg class="brand-sub"><use href="/brand/logo.svg#tagline" /></svg></span>
      </a>
      <select id="categorySelect">
        <option value="all">전체 카테고리</option>
      </select>
      <select id="dateFilter" aria-label="진행 날짜">
        <option value="all">전체 날짜</option>
        <option value="today">진행 중</option>
        <option value="weekend">이번 주말</option>
        <option value="week">7일 안</option>
      </select>
      <input type="text" id="searchInput" placeholder="행사 이름 검색" enterkeyhint="search" />
      <label class="past-toggle">
        <input type="checkbox" id="showPastCheckbox" />
        지난 행사 보기
      </label>
      <div id="topbarActions">
        <!-- 화면 모드 (theme.js): PC = ☾/☀ 두 단계 단추, 모바일 ☰ 메뉴 = 3칸 -->
        <!-- 그림은 css 가 테마에 맞춰 하나만 보임(첫 그리기부터 맞음), 이름은 theme.js 가 바꿈 -->
        <button id="themeToggleBtn" type="button" class="theme-toggle" data-theme-toggle aria-label="어두운 화면으로" title="어두운 화면으로"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg></button>
        <!-- 로그인했을 때만 이름(회원 #N, P5 뒤 닉네임) + [마이페이지] — 이름 글자는 index.js memberLabel() 한 곳에서 정함 -->
        <span id="authStatus" hidden></span>
        <a id="loginPageBtn" class="login-btn login" href="login.html">로그인</a>
        <a id="mypageBtn" class="login-btn login" href="mypage.html">마이페이지</a>
        <!-- ☰ 메뉴 줄 (P4): PC = ☰ 아래 펼침 / 모바일 = ☰ 메뉴 안. 로그아웃은 P5 에서 마이페이지로 옮김 -->
        <div id="menuLinks" class="menu-links">
          <button id="logoutBtn" type="button" class="menu-link" hidden>로그아웃</button>
          <a class="menu-link" href="about.html">서비스 안내</a>
          <a class="menu-link" href="privacy.html">개인정보 처리방침</a>
        </div>
        <!-- ☰ 메뉴 맨 아래 (모바일만 보임): 📱 기기 설정 · ☀ 라이트 · ☾ 다크 (그림만, 이름은 aria-label) -->
        <div class="theme-mode" data-theme-mode role="group" aria-labelledby="themeModeTitle">
          <span id="themeModeTitle" class="theme-mode-title">화면 모드</span>
          <div class="theme-mode-seg">
            <button type="button" data-mode="system" aria-pressed="true" aria-label="기기 설정" title="기기 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2" /><path d="M10.5 18.5h3" /></svg></button>
            <button type="button" data-mode="light" aria-pressed="false" aria-label="라이트" title="라이트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg></button>
            <button type="button" data-mode="dark" aria-pressed="false" aria-label="다크" title="다크"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg></button>
          </div>
        </div>
      </div>
      <!-- ☰ 메뉴 버튼 (PC · 모바일 공통, P4) + 모바일 전용 카테고리 칩 -->
      <button id="mobileMenuBtn" type="button" aria-label="메뉴" aria-expanded="false">☰</button>
      <div id="categoryChips"></div>
    </div>

    <div id="app">
      <div id="map"></div>
      <button id="sidebarToggleBtn">›</button>
      <aside id="sidebar">
        <!-- 모바일 전용: 바텀시트 손잡이 + 결과 개수 (끌어올리기) -->
        <!-- 바 전체가 버튼: 탭 · 끌기 · 키보드(Enter · Space) -->
        <div id="sheetHeader" role="button" tabindex="0" aria-expanded="false" aria-label="행사 불러오는 중">
          <div class="sheet-handle"></div>
          <div class="sheet-bar">
            <span id="resultCount">행사 불러오는 중…</span>
            <span id="sheetToggle">
              <!-- 지도 탭 = "목록 보기 ▴", 목록 보기 화면 = [지도 보기] (P3, 그림은 CSS 가 상태에 맞춰 하나만) -->
              <svg class="toggle-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z" /></svg>
              <span id="sheetToggleText">목록 보기</span>
              <svg class="toggle-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
            </span>
          </div>
        </div>
        <!-- 모바일 찜 탭 전용: 찜 N | 최근 본 N (디자인 05). 최근 본 = 이 기기 브라우저 저장소 (recent-views.js) -->
        <div id="favTabs" class="fav-tabs" role="tablist" aria-label="찜 · 최근 본" hidden>
          <button type="button" class="fav-tab active" data-view="fav" id="favTabFav" role="tab" aria-selected="true" aria-controls="list">찜 <span id="favTabFavCount">0</span></button>
          <button type="button" class="fav-tab" data-view="recent" id="favTabRecent" role="tab" aria-selected="false" aria-controls="list" tabindex="-1">최근 본 <span id="favTabRecentCount">0</span></button>
        </div>
        <!-- 날짜 고르기 (calendar-strip.js, 11/11 시안 CalClosed · CalOpen · PcCard). 고른 날짜는 #dateFilter 값으로
             목록 위 탭 [진행 중 · 진행 예정 · 달력 ▾] — PC · 모바일 목록 화면 같음 (P3, 모바일 2주 날짜 줄 · 달력 펼치기는 CSS 로 숨김) -->
        <div id="datePanel" class="date-panel" hidden>
          <div class="pc-date-tabs" role="group" aria-label="진행 상태 · 날짜">
            <button type="button" class="pc-date-tab" data-status="open" aria-pressed="false">진행 중 <span id="pcOpenCount"></span></button>
            <button type="button" class="pc-date-tab" data-status="upcoming" aria-pressed="false">진행 예정 <span id="pcUpcomingCount"></span></button>
            <button type="button" id="pcCalBtn" class="pc-cal-btn" aria-expanded="false" aria-controls="calMonth">달력 ▾</button>
          </div>
          <div class="strip-head">
            <span id="stripMonth" class="strip-month"></span>
            <button type="button" id="calOpenBtn" class="cal-toggle" aria-expanded="false" aria-controls="calMonth">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>달력 펼치기
            </button>
          </div>
          <div id="dateStrip" class="date-strip" role="group" aria-label="날짜 고르기"></div>
          <div id="calMonth" class="cal-month" hidden>
            <div class="cal-head">
              <span id="calTitle" class="cal-title"></span>
              <button type="button" id="calPrev" class="cal-nav" aria-label="이전 달">‹</button>
              <button type="button" id="calNext" class="cal-nav" aria-label="다음 달">›</button>
              <button type="button" id="calCloseBtn" class="cal-toggle cal-close" aria-controls="calMonth">달력 접기 ︿</button>
            </div>
            <div id="calGrid" class="cal-grid" role="group" aria-label="달력 날짜 고르기"></div>
          </div>
          <div id="dateHeading" class="date-heading" hidden>
            <span id="dateHeadingText"></span>
            <button type="button" id="dateClearBtn" class="date-clear">전체 날짜</button>
          </div>
        </div>
        <div id="list"></div>
        <!-- 모바일 목록 보기 화면 하단 가운데 떠 있는 [지도 보기] (P3 확정 시안 MobileList) -->
        <button type="button" id="listMapBtn" class="list-map-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z" /></svg>지도 보기
        </button>
      </aside>
      <!-- 하단 카드 ("가까운 순 · 1 / N" + 좌우로 넘기는 카드). PC = 기본으로 늘 표시 (11/11), 모바일 = 지도 탭이면 늘 (P3)
           모바일은 위치 글이 카드 아래 "밀어서 다음 행사 · 1 / 32" (CSS order). 띠 = 같은 장소 행사가 2개 이상일 때만 -->
      <div id="previewArea">
        <span id="previewLabel"></span>
        <div id="previewPlaceBand" class="place-band" hidden></div>
        <div id="previewStripWrap">
          <div id="previewStrip"></div>
          <!-- 마우스 PC 전용 좌우 화살표 (strip-nav.js), 터치 화면에서는 숨김 -->
          <button type="button" class="strip-arrow prev" id="previewPrev" aria-label="이전 카드" aria-controls="previewStrip" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <button type="button" class="strip-arrow next" id="previewNext" aria-label="다음 카드" aria-controls="previewStrip" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
      </div>
    </div>
    <!-- 모바일 전용: 홈 화면 (docs/design/mobile-design-v1.md 01). 지도 위를 덮고 페이지 전체가 스크롤 -->
    <section id="homeView" aria-label="홈">
      <header class="home-head">
        <span class="home-logo" role="img" aria-label="수원바이블 · 수원 문화지도"><svg class="brand-seal" aria-hidden="true"><use href="/brand/logo.svg#seal-sm" /></svg><span class="brand-words" aria-hidden="true"><svg class="brand-name"><use href="/brand/logo.svg#wordmark" /></svg><svg class="brand-sub"><use href="/brand/logo.svg#tagline" /></svg></span></span>
        <div class="home-head-actions">
          <!-- 화면 모드 ☾/☀ (PC 상단 바와 같은 두 단계, theme.js) — 기기 설정으로 되돌리기는 지도 탭 ☰ 메뉴 -->
          <button id="homeThemeBtn" type="button" class="icon-btn" data-theme-toggle aria-label="어두운 화면으로" title="어두운 화면으로"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg></button>
          <button id="homeSearchBtn" type="button" class="icon-btn" aria-label="행사 검색">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          </button>
        </div>
      </header>
      <!-- 홈 3칸 (11/11 시안): ① 지금 진행 중 ② 곧 종료 | 곧 시작 (7일 안) ③ 달별 행사. 고르는 규칙은 home-picks.js
           겹침 규칙: ① 가로 카드는 ② "곧 종료"에 나온 행사를 뺌. 수 N 은 진행 중 전체 (= "전체 →" 목록 수, 날짜 칩 "진행 중") -->
      <section id="homeNow" class="home-now" aria-labelledby="homeNowTitle">
        <div class="home-section-head">
          <h1 id="homeNowTitle" class="home-section-title">지금 진행 중 <strong id="homeNowCount">…</strong></h1>
          <button type="button" id="homeNowAll" class="home-more">전체 →</button>
        </div>
        <div id="homeNowTrack" class="now-track"></div>
      </section>
      <section class="home-section" aria-label="곧 종료 · 곧 시작">
        <div class="home-tabs">
          <div class="home-tab-list" role="tablist" aria-label="곧 종료 · 곧 시작">
            <button type="button" class="home-tab active" data-soon="ending" id="homeTabEnding" role="tab" aria-selected="true" aria-controls="homeSoonList">곧 종료 <span id="homeEndingCount" class="home-tab-count"></span></button>
            <button type="button" class="home-tab" data-soon="starting" id="homeTabStarting" role="tab" aria-selected="false" aria-controls="homeSoonList" tabindex="-1">곧 시작 <span id="homeStartingCount" class="home-tab-count"></span></button>
          </div>
          <span class="home-tabs-note">7일 안</span>
        </div>
        <div id="homeSoonList" role="tabpanel" aria-labelledby="homeTabEnding"></div>
      </section>
      <!-- 달별 행사: 다음 달부터 그 달에 시작하는 행사. 달 칩 "12월 · 14" 를 누르면 그 달 카드. 고를 행사가 없으면 숨김 -->
      <section id="homeMonths" class="home-months" aria-labelledby="homeMonthsTitle" hidden>
        <h2 id="homeMonthsTitle" class="home-section-title">달별 행사</h2>
        <div id="homeMonthChips" class="month-chips" role="group" aria-label="달 고르기"></div>
        <div id="homeMonthTrack" class="month-track"></div>
      </section>
      <!-- 내 주변: 구 칩 4개 + 작은 지도(그 구 행사 위치, 손으로 못 움직임) + "○○구 행사 N개 · 지도에서 보기" → 지도 탭 + 구 필터
           구 칩 · 작은 지도는 index.js 가 채움. 행사를 받기 전 · 실패하면 숨김 -->
      <section id="homeNearby" class="home-nearby" aria-labelledby="homeNearbyTitle" hidden>
        <h2 id="homeNearbyTitle" class="home-section-title">내 주변</h2>
        <div id="homeDistrictChips" class="home-districts" role="group" aria-label="구 고르기"></div>
        <div id="homeNearbyMap" class="nearby-map" aria-hidden="true"></div>
        <button type="button" id="homeNearbyGo" class="nearby-go"></button>
      </section>
    </section>
    <!-- 모바일 전용: 검색 화면 (디자인 06 입력 중). 홈 검색 버튼 · 지도 탭 검색창을 누르면 화면 전체를 덮음
         입력 중(06) 행은 글자만(사진 없음): [상태 배지] 제목(검색어 강조) … 구
         엔터 → 결과(07): "검색 결과 N개 · 종료 임박순" + 행사 행(포스터 · 배지 · D-day) + ♡ -->
    <section id="searchView" aria-label="행사 검색" hidden>
      <div class="search-head">
        <button type="button" id="searchBackBtn" class="icon-btn" aria-label="검색 닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <input type="search" id="searchViewInput" placeholder="행사 이름 · 장소 검색" enterkeyhint="search" autocomplete="off" aria-label="행사 이름 · 장소 검색" aria-controls="searchSuggest" />
        <button type="button" id="searchClearBtn" class="icon-btn" aria-label="검색어 지우기" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div id="searchSuggest" class="search-suggest"></div>
    </section>
    <!-- 모바일 전용: 하단 탭 (docs/design/mobile-design-v1.md 2번) -->
    <nav id="tabBar" aria-label="하단 탭">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <a id="routeGoogle" class="route-link google" href="#" target="_blank" rel="noopener">
