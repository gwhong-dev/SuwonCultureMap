<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>수원 문화 프로그램 지도</title>
    <style>
      :root {
        --sidebar-width: 450px; /* 모바일 미디어쿼리에서 100vw로 덮어씀 */
      }

      body {
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #topbar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.875rem;
        background: #222;
        color: #fff;
        font-size: 0.85rem;
        flex-wrap: wrap;
      }
      #topbar input,
      #topbar select {
        padding: 0.375rem;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      #authStatus {
        margin-left: auto;
        margin-right: 0.25rem;
      }
      .login-btn {
        padding: 0.375rem 0.75rem;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.8rem;
        border: none;
        cursor: pointer;
      }
      .login-btn.kakao {
        background: #fee500;
        color: #000;
      }
      .login-btn.google {
        background: #fff;
        color: #000;
      }
      .login-btn.naver {
        background: #03c75a;
        color: #fff;
      }
      .login-btn.sync {
        background: #4a90d9;
        color: #fff;
      }
      .login-btn.logout {
        background: #555;
        color: #fff;
      }
      .login-btn.login {
        background: #4a90d9;
        color: #fff;
      }

      #app {
        display: flex;
        flex: 1;
        min-height: 0;
        position: relative; /* 토글 버튼 절대 위치 기준점 */
      }
      #map {
        flex: 1;
      }

      #sidebar {
        width: var(--sidebar-width);
        flex: none;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #ddd;
        background: #fff;
        overflow: hidden;
        transition: width 0.25s ease;
      }
      #sidebar.collapsed {
        width: 0;
        border-left: none;
      }

      /* ===== 사이드바 접기/펼치기 토글 버튼 (네이버지도 스타일) ===== */
      #sidebarToggleBtn {
        position: absolute;
        top: 50%;
        right: var(--sidebar-width);
        transform: translate(50%, -50%);
        width: 28px;
        height: 48px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        font-size: 0.9rem;
        z-index: 10;
        transition: right 0.25s ease, transform 0.25s ease;
      }
      #sidebarToggleBtn.collapsed {
        right: 8px; /* 접혔을 때는 화면 밖으로 안 밀려나가게 오른쪽에 여백만 두고 붙임 */
        transform: translateY(-50%); /* 접힘 상태에선 절반을 화면 밖으로 미는 translateX 제거 */
      }
      #list {
        flex: 1;
        overflow-y: auto;
      }
      .event-item {
        position: relative; /* 별 배지 위치 잡으려고 추가 */
        display: flex;
        gap: 0.625rem;
        padding: 0.625rem 0.875rem;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
      }
      /* ===== 찜한 행사 표시 (Side-bar 카드 우측 상단 별) ===== */
      .favorite-badge {
        position: absolute;
        top: 8px;
        right: 10px;
        font-size: 1rem;
        color: #f5a623;
      }
      .event-item:hover {
        background: #f7f7f7;
      }
      .event-item .date {
        font-size: 0.78rem;
        color: #888;
      }
      .event-item .title {
        font-size: 0.9rem;
        margin-top: 0.125rem;
      }

      /* ===== Side-bar 이벤트 카드 ===== */
      .event-item {
        display: flex;
        position: relative; /* ← 이 줄 추가 */
        gap: 0.625rem;
        padding: 0.625rem 0.875rem;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
      }
      .event-item:hover {
        background: #f7f7f7;
      }
      .event-thumb {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 6px;
        flex: none;
        background: #eee;
      }
      .event-body {
        flex: 1;
        min-width: 0;
      }
      .event-body .date {
        font-size: 0.75rem;
        color: #888;
      }
      .event-body .title {
        font-size: 0.9rem;
        margin-top: 0.125rem;
        font-weight: 600;
      }
      .event-body .info {
        font-size: 0.78rem;
        color: #666;
        margin-top: 0.25rem;
        white-space: pre-line; /* info의 \n을 실제 줄바꿈으로 표시 (모달과 동일) */
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ===== 상세정보 큰 팝업창 ===== */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-card {
        background: #fff;
        width: 420px;
        max-width: 90vw;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 12px;
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: 10px;
        right: 14px;
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: #fff;
        z-index: 2;
      }
      .modal-image {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        background: #ddd;
      }
      .modal-body {
        padding: 1rem 1.25rem;
      }
      .modal-date {
        font-size: 0.8rem;
        color: #888;
      }
      .modal-title {
        font-size: 1.15rem;
        margin: 0.375rem 0 0.625rem;
      }
      .modal-info {
        font-size: 0.88rem;
        color: #444;
        white-space: pre-line;
        line-height: 1.6;
        margin-bottom: 1rem;
      }
      .favorite-btn {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid #f5a623;
        background: #fff;
        color: #f5a623;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .favorite-btn.active {
        background: #f5a623;
        color: #fff;
      }
      .modal-actions {
        display: flex;
        gap: 0.5rem;
      }
      .modal-link-btn {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid #4a90d9;
        background: #fff;
        color: #4a90d9;
        cursor: pointer;
        font-size: 0.9rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }

      /* ===== 마커 InfoWindow 제목 (클릭 가능) ===== */
      .infowindow-title {
        padding: 0.375rem 0.5rem;
        cursor: pointer;
        color: #2f6f6b;
        text-decoration: underline;
        font-size: 0.85rem;
        max-width: 400px;
        white-space: normal;
        word-break: break-word;
      }

      /* ===== 모바일 대응 (2단계: 모바일 / 데스크톱) ===== */
      @media (max-width: 768px) {
        :root {
          --sidebar-width: 100vw;
        }

        #topbar {
          font-size: 0.78rem;
          padding: 0.375rem 0.625rem;
          gap: 0.375rem;
        }

        /* 사이드바가 지도를 밀어내지 않고, 지도 위에 덮어씌워지는 오버레이로 동작 */
        #sidebar {
          position: absolute;
          top: 0;
          right: 0;
          height: 100%;
          box-shadow: -2px 0 10px rgba(0, 0, 0, 0.2);
        }

        .modal-image {
          height: 160px;
        }
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <select id="categorySelect">
        <option value="all">전체 카테고리</option>
      </select>
      <input type="text" id="searchInput" placeholder="행사 이름 검색" />
      <label style="display: flex; align-items: center; gap: 0.25rem; white-space: nowrap;">
        <input type="checkbox" id="showPastCheckbox" />
        지난 행사 보기
      </label>
      <span id="authStatus">로그인 확인 중...</span>
      <a id="loginPageBtn" class="login-btn login" href="login.html">로그인</a>
      <a id="mypageBtn" class="login-btn login" href="mypage.html" style="display: none">마이페이지</a>
      <button id="syncBtn" class="login-btn sync">행사 동기화</button>
      <button id="logoutBtn" class="login-btn logout" style="display: none">
        로그아웃
      </button>
    </div>

    <div id="app">
      <div id="map"></div>
      <button id="sidebarToggleBtn">›</button>
      <aside id="sidebar">
        <div id="list"></div>
      </aside>
    </div>

    <!-- ===== 상세정보 큰 팝업창 ===== -->
    <div id="detailModal" class="modal-overlay" style="display: none">
      <div class="modal-card">
        <button id="modalCloseBtn" class="modal-close">×</button>
        <img id="modalImage" class="modal-image" src="" alt="" />
        <div class="modal-body">
          <div id="modalDate" class="modal-date"></div>
          <h2 id="modalTitle" class="modal-title"></h2>
          <div id="modalInfo" class="modal-info"></div>
          <div class="modal-actions">
            <button id="modalFavoriteBtn" class="favorite-btn">☆ 즐겨찾기</button>
            <a id="modalLinkBtn" class="modal-link-btn" href="#" target="_blank" rel="noopener">원문 보기 →</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7e3b2a42df77bc183241db2bcc6c3cbb&autoload=false"></script>
    <script>
      var map;
      var markerList = [];
      var currentInfowindow = null;

      // ===== 카테고리별 마커 아이콘 =====
      var CATEGORY_STYLE = {
        행사: { color: "#4A90D9", emoji: "📅" },
        공연: { color: "#D9534F", emoji: "🎤" },
        전시: { color: "#8E44AD", emoji: "🎨" },
        축제: { color: "#F5A623", emoji: "🎉" },
        기타: { color: "#7F8C8D", emoji: "📌" },
      };

      function createMarkerIcon(category) {
        var style = CATEGORY_STYLE[category] || CATEGORY_STYLE["기타"];
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36">' +
          '<circle cx="18" cy="18" r="16" fill="' +
          style.color +
          '" stroke="#fff" stroke-width="2"/>' +
          '<text x="18" y="24" font-size="16" text-anchor="middle">' +
          style.emoji +
          "</text>" +
          "</svg>";
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }

      // ===== 같은 좌표에 행사가 여러 개일 때 쓰는 "개수 뱃지" 마커 아이콘 =====
      function createClusterMarkerIcon(count) {
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40">' +
          '<circle cx="18" cy="20" r="16" fill="#34495E" stroke="#fff" stroke-width="2"/>' +
          '<text x="18" y="26" font-size="15" text-anchor="middle">📍</text>' +
          '<circle cx="31" cy="9" r="9" fill="#E74C3C" stroke="#fff" stroke-width="2"/>' +
          '<text x="31" y="13" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">' +
          count +
          "</text>" +
          "</svg>";
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }

      // ===== info 텍스트에서 "장소" 값만 뽑기 (목록 팝업 제목용) =====
      // 라벨이 "장소" 하나로만 안 오고 "행사장소", "공연장소" 등으로도 와서
      // 포함 여부로 찾음. "장소" 계열이 아예 없으면 "주소/소재지"로 대체
      function extractPlaceName(infoText) {
        if (!infoText) return null;
        var lines = infoText.split("\n");
        var addressFallback = null;

        for (var i = 0; i < lines.length; i++) {
          var idx = lines[i].indexOf(":");
          if (idx === -1) continue;
          var label = lines[i].substring(0, idx).trim();
          var value = lines[i].substring(idx + 1).trim();

          if (label.indexOf("장소") !== -1) {
            return value;
          }
          if (!addressFallback && label.indexOf("주소") !== -1) {
            addressFallback = value;
          }
        }

        return addressFallback;
      }

      // ===== 이벤트 배열을 좌표(위치)별로 묶기 =====
      function groupByLocation(items) {
        var groups = {};
        var order = [];
        items.forEach(function (item) {
          var key = item.event.latitude + "," + item.event.longitude;
          if (!groups[key]) {
            groups[key] = [];
            order.push(key);
          }
          groups[key].push(item);
        });
        return order.map(function (key) {
          return groups[key];
        });
      }

      // ===== 현재 지도에 떠 있는 "장소별 마커"들 (필터 바뀔 때마다 새로 그림) =====
      var locationMarkers = [];

      function renderLocationMarkers(visibleItems) {
        locationMarkers.forEach(function (lm) {
          lm.marker.setMap(null);
        });
        locationMarkers = [];

        groupByLocation(visibleItems).forEach(function (group) {
          var first = group[0].event;
          var position = new kakao.maps.LatLng(first.latitude, first.longitude);

          var markerImage =
            group.length === 1
              ? new kakao.maps.MarkerImage(
                  createMarkerIcon(first.category),
                  new kakao.maps.Size(36, 36),
                )
              : new kakao.maps.MarkerImage(
                  createClusterMarkerIcon(group.length),
                  new kakao.maps.Size(40, 40),
                );

          var marker = new kakao.maps.Marker({
            position: position,
            image: markerImage,
          });
          marker.setMap(map);

          var infowindowContent;
          if (group.length === 1) {
            var singlePlaceName = extractPlaceName(first.info);
            infowindowContent =
              '<div style="width:260px;">' +
              (singlePlaceName
                ? '<div style="padding: 0.5rem 0.625rem; font-size:0.8rem; font-weight:700; color:#1f4e79; background:#e8f0fa; border-bottom:1px solid #cddcee; text-align:center;">' +
                  singlePlaceName +
                  "</div>"
                : "") +
              '<div style="padding: 0.25rem 0.5rem 0.5rem; cursor:pointer; color:#2f6f6b; text-decoration:underline; font-size:0.85rem; white-space:normal; word-break:break-word; text-align:center;" onclick="openDetailFromMarker(' +
              first.id +
              ')">' +
              first.title +
              "</div>" +
              "</div>";
          } else {
            // 공연일(startDate) 빠른 순으로 정렬하되, 제일 빠른 게 목록 맨 아래(스택 아래쪽)에 오도록 뒤집음
            var sorted = group.slice().sort(function (a, b) {
              var da = a.event.startDate;
              var db = b.event.startDate;
              if (!da && !db) return 0;
              if (!da) return 1;
              if (!db) return -1;
              return da.localeCompare(db);
            });
            sorted.reverse();

            var rows = sorted
              .map(function (item, i) {
                // 위에서부터 순서대로 흰색/회색 번갈아 표시 (첫 줄은 항상 흰색이라 헤더랑 안 붙음)
                var stripeStyle = i % 2 === 1 ? "background:#f2f2f2;" : "";
                return (
                  '<div onclick="openDetailFromMarker(' +
                  item.event.id +
                  ')" style="padding: 0.5rem 0.375rem; border-top:1px solid #eee; cursor:pointer; font-size:0.85rem; color:#2f6f6b; ' +
                  stripeStyle +
                  '">' +
                  item.event.title +
                  "</div>"
                );
              })
              .join("");
            var placeName = extractPlaceName(first.info) || first.title;
            infowindowContent =
              '<div style="width:230px; max-height:220px; overflow-y:auto;">' +
              '<div style="padding: 0.5rem 0.625rem; font-size:0.8rem; font-weight:700; color:#1f4e79; background:#e8f0fa; border-bottom:1px solid #cddcee; text-align:center;">' +
              placeName +
              "</div>" +
              rows +
              "</div>";
          }

          var infowindow = new kakao.maps.InfoWindow({ content: infowindowContent });
          kakao.maps.event.addListener(marker, "click", function () {
            toggleInfowindow(infowindow, marker);
          });

          locationMarkers.push({
            marker: marker,
            infowindow: infowindow,
            key: first.latitude + "," + first.longitude,
          });
        });
      }

      kakao.maps.load(function () {
        var mapContainer = document.getElementById("map");
        var mapOption = {
          center: new kakao.maps.LatLng(37.2636, 127.0286),
          level: 6,
        };
        map = new kakao.maps.Map(mapContainer, mapOption);

        fetch("/api/events")
          .then((response) => response.json())
          .then((events) => {
            setupCategoryOptions(events);

            // 이 시점엔 마커를 만들지 않음. 실제 마커는 filterMarkers() -> renderLocationMarkers()에서
            // "장소별로 묶어서" 그림 (같은 좌표에 행사가 여러 개면 개수 뱃지 마커로)
            events.forEach(function (event) {
              markerList.push({ event: event });
            });

            filterMarkers();
          });
      });

      function toggleInfowindow(infowindow, marker) {
        if (currentInfowindow === infowindow) {
          infowindow.close();
          currentInfowindow = null;
          return;
        }
        if (currentInfowindow) {
          currentInfowindow.close();
        }
        infowindow.open(map, marker);
        currentInfowindow = infowindow;
      }

      // ===== 카테고리 드롭다운 순서 고정 + "찜"(가상 카테고리) 추가 =====
      var CATEGORY_ORDER = ["행사", "공연", "전시", "축제", "찜", "기타"];

      function setupCategoryOptions(events) {
        var categories = [...new Set(events.map((e) => e.category))];
        var select = document.getElementById("categorySelect");

        CATEGORY_ORDER.forEach(function (category) {
          // '찜'은 실제 DB 카테고리가 아니라 항상 넣어줌
          if (category === "찜" || categories.includes(category)) {
            var option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            select.appendChild(option);
          }
        });
      }

      // ===== 지난 행사 판별 (endDate가 오늘보다 이전이면 지난 행사) =====
      function isPastEvent(event) {
        if (!event.endDate) return false; // 종료일 정보 없으면 지난 행사로 취급 안 함
        var today = new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
        return event.endDate < today;
      }

      // ===== 필터링 (검색어 + 카테고리 + 지난 행사 여부, '찜'은 즐겨찾기 목록으로 필터) =====
      function filterMarkers() {
        var keyword = document.getElementById("searchInput").value.trim();
        var selectedCategory = document.getElementById("categorySelect").value;
        var showPast = document.getElementById("showPastCheckbox").checked;

        if (currentInfowindow) {
          currentInfowindow.close();
          currentInfowindow = null;
        }

        var visibleItems = [];

        markerList.forEach(function (item) {
          var matchesKeyword = item.event.title.includes(keyword);
          var matchesCategory;

          if (selectedCategory === "all") {
            matchesCategory = true;
          } else if (selectedCategory === "찜") {
            matchesCategory = favoriteEventIds.has(item.event.id);
          } else {
            matchesCategory = item.event.category === selectedCategory;
          }

          var matchesPast = showPast || !isPastEvent(item.event);

          var visible = matchesKeyword && matchesCategory && matchesPast;

          if (visible) {
            visibleItems.push(item);
          }
        });

        renderLocationMarkers(visibleItems); // 장소별로 묶어서 마커 다시 그리기
        renderSidebar(visibleItems);
      }

      // ===== Side-bar용 info 요약 (이용료/장소/시간만 추출) =====
      function extractSummaryInfo(infoText) {
        if (!infoText) return "";

        // "라벨: 내용" 형태의 줄들을 라벨 기준으로 매핑
        var map = {};
        infoText.split("\n").forEach(function (line) {
          var idx = line.indexOf(":");
          if (idx === -1) return;
          var label = line.substring(0, idx).trim();
          map[label] = line;
        });

        var result = [];

        // 1) 이용료, 장소 순서로 먼저 추가
        ["이용료", "장소"].forEach(function (label) {
          if (map[label]) result.push(map[label]);
        });

        // 2) 요일/시간 관련 라벨은 API마다 이름이 달라서 포함 여부로 탐색
        Object.keys(map).forEach(function (label) {
          if (label.indexOf("시간") !== -1 || label.indexOf("요일") !== -1) {
            if (result.indexOf(map[label]) === -1) result.push(map[label]);
          }
        });

        return result.join("\n");
      }

      // ===== Side-bar 카드 렌더링 (이미지 + 제목 + info 요약) =====
      function renderSidebar(items) {
        var sorted = items.slice().sort(function (a, b) {
          var da = a.event.startDate;
          var db = b.event.startDate;
          if (!da && !db) return 0;
          if (!da) return 1;
          if (!db) return -1;
          return da.localeCompare(db);
        });

        var list = document.getElementById("list");
        list.innerHTML = "";

        sorted.forEach(function (item) {
          var div = document.createElement("div");
          div.className = "event-item";

          var dateText = item.event.startDate
            ? item.event.startDate +
              (item.event.endDate && item.event.endDate !== item.event.startDate
                ? " ~ " + item.event.endDate
                : "")
            : "기간 정보 없음";

          var imgSrc = item.event.imageUrl || "";
          var infoText = extractSummaryInfo(item.event.info || ""); // 사이드바엔 이용료/장소/시간만
          var isFavorited = favoriteEventIds.has(item.event.id); // 찜 여부 확인

          div.innerHTML =
            '<img class="event-thumb" src="' +
            imgSrc +
            '" onerror="this.style.visibility=\'hidden\'">' +
            (isFavorited ? '<span class="favorite-badge">★</span>' : "") + // 찜한 행사만 별 표시
            '<div class="event-body">' +
            '<div class="date">' +
            dateText +
            "</div>" +
            '<div class="title">' +
            item.event.title +
            "</div>" +
            '<div class="info">' +
            infoText +
            "</div>" +
            "</div>";

          div.addEventListener("click", function () {
            map.setCenter(
              new kakao.maps.LatLng(item.event.latitude, item.event.longitude),
            );
            map.setLevel(5);

            // 사이드바에서 클릭해도 지도의 해당 마커를 실제로 클릭한 것처럼 InfoWindow를 띄움
            var key = item.event.latitude + "," + item.event.longitude;
            var locMarker = locationMarkers.find(function (lm) {
              return lm.key === key;
            });
            if (locMarker) {
              toggleInfowindow(locMarker.infowindow, locMarker.marker);
            }

            openDetailModal(item.event);
          });

          list.appendChild(div);
        });
      }

      document
        .getElementById("searchInput")
        .addEventListener("input", filterMarkers);
      document
        .getElementById("categorySelect")
        .addEventListener("change", filterMarkers);
      document
        .getElementById("showPastCheckbox")
        .addEventListener("change", filterMarkers);

      document.getElementById("syncBtn").addEventListener("click", function () {
        fetch("/api/events/sync", { method: "POST" })
          .then((r) => r.text())
          .then(function (msg) {
            alert(msg);
            location.reload();
          });
      });

      // ===== 로그인 상태 + 내 즐겨찾기 목록 확인 =====
      var isLoggedIn = false;
      var favoriteEventIds = new Set();

      function checkAuth() {
        fetch("/api/auth/me")
          .then((r) => r.json())
          .then(function (data) {
            isLoggedIn = data.loggedIn;

            var status = document.getElementById("authStatus");
            var loginPageBtn = document.getElementById("loginPageBtn");
            var mypageBtn = document.getElementById("mypageBtn");
            var logoutBtn = document.getElementById("logoutBtn");

            if (isLoggedIn) {
              status.textContent =
                "로그인됨 (회원 번호: " + data.memberId + ")";
              loginPageBtn.style.display = "none";
              mypageBtn.style.display = "inline-block";
              logoutBtn.style.display = "inline-block";
              return fetch("/api/favorites").then((r) => r.json()); // 로그인 상태면 즐겨찾기 목록도 받아옴
            } else {
              status.textContent = "로그인 안 됨";
              loginPageBtn.style.display = "inline-block";
              mypageBtn.style.display = "none";
              logoutBtn.style.display = "none";
              return [];
            }
          })
          .then(function (favorites) {
            favoriteEventIds = new Set(
              favorites.map(function (e) {
                return e.id;
              }),
            );
            filterMarkers(); // ← 즐겨찾기 목록 다 받아온 뒤, 화면도 한 번 더 새로 그림
          });
      }

      document
        .getElementById("logoutBtn")
        .addEventListener("click", function () {
          fetch("/api/auth/logout", { method: "POST" }).then(function () {
            checkAuth();
          });
        });

      checkAuth();

      // ===== 사이드바 접기/펼치기 토글 =====
      var sidebarToggleBtn = document.getElementById("sidebarToggleBtn");
      var sidebarEl = document.getElementById("sidebar");
      // 모바일 화면(768px 이하)에서는 사이드바가 지도를 전부 가려버리니 처음엔 접어둠
      var sidebarCollapsed = window.innerWidth <= 768;
      sidebarEl.classList.toggle("collapsed", sidebarCollapsed);
      sidebarToggleBtn.classList.toggle("collapsed", sidebarCollapsed);
      sidebarToggleBtn.textContent = sidebarCollapsed ? "‹" : "›";

      sidebarToggleBtn.addEventListener("click", function () {
        sidebarCollapsed = !sidebarCollapsed;
        sidebarEl.classList.toggle("collapsed", sidebarCollapsed);
        sidebarToggleBtn.classList.toggle("collapsed", sidebarCollapsed);
        sidebarToggleBtn.textContent = sidebarCollapsed ? "‹" : "›";

        // ===== 카카오맵은 컨테이너 크기가 바뀌어도 스스로 다시 안 그림 =====
        // 사이드바 너비 변하는 애니메이션(0.25s)이 끝난 뒤 지도 크기를 다시 계산시킴
        setTimeout(function () {
          if (map) {
            map.relayout();
          }
        }, 300);
      });

      // ===== 상세정보 큰 팝업창 열기/닫기 =====
      function openDetailModal(event) {
        document.getElementById("modalImage").src = event.imageUrl || "";
        document.getElementById("modalTitle").textContent = event.title;
        document.getElementById("modalDate").textContent = event.startDate
          ? event.startDate +
            (event.endDate && event.endDate !== event.startDate
              ? " ~ " + event.endDate
              : "")
          : "기간 정보 없음";
        document.getElementById("modalInfo").textContent = event.info || "";

        // ===== 원문 링크 버튼: link 없으면 숨김 =====
        var linkBtn = document.getElementById("modalLinkBtn");
        if (event.link) {
          linkBtn.href = event.link;
          linkBtn.style.display = "inline-flex";
        } else {
          linkBtn.style.display = "none";
        }

        updateFavoriteButton(event.id);

        document.getElementById("modalFavoriteBtn").onclick = function () {
          toggleFavorite(event.id);
        };

        document.getElementById("detailModal").style.display = "flex";
      }

      // ===== 마커 InfoWindow 제목 클릭 → 상세 팝업 열기 =====
      function openDetailFromMarker(eventId) {
        var found = markerList.find(function (item) {
          return item.event.id === eventId;
        });
        if (found) {
          openDetailModal(found.event);
        }
      }

      function closeDetailModal() {
        document.getElementById("detailModal").style.display = "none";
      }

      // ===== ESC 키로 상세 모달 + 마커 팝업(InfoWindow) 닫기 =====
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closeDetailModal();
          if (currentInfowindow) {
            currentInfowindow.close();
            currentInfowindow = null;
          }
        }
      });

      // ===== 즐겨찾기 버튼 상태/토글 =====
      function updateFavoriteButton(eventId) {
        var btn = document.getElementById("modalFavoriteBtn");
        if (favoriteEventIds.has(eventId)) {
          btn.textContent = "★ 즐겨찾기됨";
          btn.classList.add("active");
        } else {
          btn.textContent = "☆ 즐겨찾기";
          btn.classList.remove("active");
        }
      }

      function toggleFavorite(eventId) {
        if (!isLoggedIn) {
          alert("로그인이 필요합니다."); // 비회원 - 회원가입/로그인 유도
          return;
        }

        var isFavorited = favoriteEventIds.has(eventId);
        var method = isFavorited ? "DELETE" : "POST";

        fetch("/api/favorites/" + eventId, { method: method })
          .then(function (response) {
            if (!response.ok) {
              return response.text().then(function (text) {
                throw new Error(text);
              });
            }
            if (isFavorited) {
              favoriteEventIds.delete(eventId);
            } else {
              favoriteEventIds.add(eventId);
            }
            updateFavoriteButton(eventId);
            filterMarkers(); // ← 여기로 옮김 (진짜로 상태 바뀐 다음에 다시 그림)
          })
          .catch(function (err) {
            alert(err.message);
          });
      }

      document
        .getElementById("modalCloseBtn")
        .addEventListener("click", closeDetailModal);
      document
        .getElementById("detailModal")
        .addEventListener("click", function (e) {
          if (e.target.id === "detailModal") {
            closeDetailModal(); // 배경 클릭하면 닫힘
          }
        });
    </script>
  </body>
</html>
