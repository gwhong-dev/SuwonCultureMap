<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일에서 PC 화면을 축소해서 보여주지 않고, 기기 폭 그대로 그리게 함 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>수원바이블 · 수원 문화지도</title>
    <meta name="description" content="수원바이블 · 수원 문화지도 — 수원의 공연 · 전시 · 축제를 지도에서 한눈에" />
    <meta name="theme-color" content="#b4472a" />
    <!-- 브랜드 아이콘 (static/brand). 크롬 · 엣지 = svg, 사파리 · 옛 브라우저 = png · ico -->
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/manifest.json" />
    <!-- 링크 공유 미리보기 (카카오톡 · 메신저 · SNS). 이미지는 절대 주소 필요 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="수원바이블 · 수원 문화지도" />
    <meta property="og:title" content="수원바이블 · 수원 문화지도" />
    <meta property="og:description" content="수원의 공연 · 전시 · 축제를 지도에서 한눈에" />
    <meta property="og:url" content="https://suwonbible.com/" />
    <meta property="og:image" content="https://suwonbible.com/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 본문 글꼴(Pretendard 보통 굵기)을 CSS 보다 먼저 받기 시작 → 글꼴 바뀜 깜빡임 줄임 -->
    <link rel="preload" href="/brand/fonts/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <div id="topbar">
      <!-- PC 전용 로고: 낙관(도장 "수원" + 지도 핀) + 워드마크 "수원바이블" / 아래 줄 부제. 글자는 윤곽(path) — static/brand/logo.svg (scripts/brand) -->
      <a class="topbar-brand" href="/" aria-label="수원바이블 · 수원 문화지도">
        <svg class="brand-seal" aria-hidden="true"><use href="/brand/logo.svg#seal-sm" /></svg>
        <span class="brand-words" aria-hidden="true"><svg class="brand-name"><use href="/brand/logo.svg#wordmark" /></svg><svg class="brand-sub"><use href="/brand/logo.svg#tagline" /></svg></span>
      </a>
      <select id="categorySelect">
        <option value="all">전체 카테고리</option>
      </select>
      <select id="dateFilter" aria-label="진행 날짜">
        <option value="all">전체 날짜</option>
        <option value="today">오늘 진행</option>
        <option value="weekend">이번 주말</option>
        <option value="week">7일 안</option>
      </select>
      <input type="text" id="searchInput" placeholder="행사 이름 검색" enterkeyhint="search" />
      <label class="past-toggle">
        <input type="checkbox" id="showPastCheckbox" />
        지난 행사 보기
      </label>
      <div id="topbarActions">
        <span id="authStatus">로그인 확인 중...</span>
        <a id="loginPageBtn" class="login-btn login" href="login.html">로그인</a>
        <a id="mypageBtn" class="login-btn login" href="mypage.html">마이페이지</a>
        <button id="logoutBtn" class="login-btn logout">
          로그아웃
        </button>
        <a class="login-btn login" href="about.html">서비스 안내</a>
        <a class="login-btn login" href="privacy.html">개인정보 처리방침</a>
      </div>
      <!-- 모바일 전용: ☰ 메뉴 버튼 + 카테고리 칩 -->
      <button id="mobileMenuBtn" type="button" aria-label="메뉴">☰</button>
      <div id="categoryChips"></div>
    </div>

    <div id="app">
      <div id="map"></div>
      <button id="sidebarToggleBtn">›</button>
      <aside id="sidebar">
        <!-- 모바일 전용: 바텀시트 손잡이 + 결과 개수 (끌어올리기) -->
        <!-- 바 전체가 버튼: 탭 · 끌기 · 키보드(Enter · Space) -->
        <div id="sheetHeader" role="button" tabindex="0" aria-expanded="false" aria-label="행사 불러오는 중">
          <div class="sheet-handle"></div>
          <div class="sheet-bar">
            <span id="resultCount">행사 불러오는 중…</span>
            <span id="sheetToggle">
              <span id="sheetToggleText">목록 보기</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
            </span>
          </div>
        </div>
        <!-- 모바일 찜 탭 전용: 찜 N | 최근 본 N (디자인 05). 최근 본 = 이 기기 브라우저 저장소 (recent-views.js) -->
        <div id="favTabs" class="fav-tabs" role="tablist" aria-label="찜 · 최근 본" hidden>
          <button type="button" class="fav-tab active" data-view="fav" id="favTabFav" role="tab" aria-selected="true" aria-controls="list">찜 <span id="favTabFavCount">0</span></button>
          <button type="button" class="fav-tab" data-view="recent" id="favTabRecent" role="tab" aria-selected="false" aria-controls="list" tabindex="-1">최근 본 <span id="favTabRecentCount">0</span></button>
        </div>
        <div id="list"></div>
      </aside>
      <!-- 모바일 전용: 마커 탭 시 하단 카드 ("가까운 순 · 1 / N" + 좌우로 넘기는 카드) -->
      <div id="previewArea">
        <span id="previewLabel"></span>
        <div id="previewStripWrap">
          <div id="previewStrip"></div>
          <!-- 마우스 PC 전용 좌우 화살표 (strip-nav.js), 터치 화면에서는 숨김 -->
          <button type="button" class="strip-arrow prev" id="previewPrev" aria-label="이전 카드" aria-controls="previewStrip" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <button type="button" class="strip-arrow next" id="previewNext" aria-label="다음 카드" aria-controls="previewStrip" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
      </div>
    </div>
    <!-- 모바일 전용: 홈 화면 (docs/design/mobile-design-v1.md 01). 지도 위를 덮고 페이지 전체가 스크롤 -->
    <section id="homeView" aria-label="홈">
      <header class="home-head">
        <span class="home-logo" role="img" aria-label="수원바이블 · 수원 문화지도"><svg class="brand-seal" aria-hidden="true"><use href="/brand/logo.svg#seal-sm" /></svg><span class="brand-words" aria-hidden="true"><svg class="brand-name"><use href="/brand/logo.svg#wordmark" /></svg><svg class="brand-sub"><use href="/brand/logo.svg#tagline" /></svg></span></span>
        <button id="homeSearchBtn" type="button" class="icon-btn" aria-label="행사 검색">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
        </button>
      </header>
      <!-- 홈 3칸 (11/11 시안): ① 지금 진행 중 ② 곧 종료 | 곧 시작 (7일 안) ③ 달별 행사. 고르는 규칙은 home-picks.js
           겹침 규칙: ① 가로 카드는 ② "곧 종료"에 나온 행사를 뺌. 수 N 은 오늘 진행 전체 (= "전체 →" 목록 수) -->
      <section id="homeNow" class="home-now" aria-labelledby="homeNowTitle">
        <div class="home-section-head">
          <h1 id="homeNowTitle" class="home-section-title">지금 진행 중 <strong id="homeNowCount">…</strong></h1>
          <button type="button" id="homeNowAll" class="home-more">전체 →</button>
        </div>
        <div id="homeNowTrack" class="now-track"></div>
      </section>
      <section class="home-section" aria-label="곧 종료 · 곧 시작">
        <div class="home-tabs">
          <div class="home-tab-list" role="tablist" aria-label="곧 종료 · 곧 시작">
            <button type="button" class="home-tab active" data-soon="ending" id="homeTabEnding" role="tab" aria-selected="true" aria-controls="homeSoonList">곧 종료 <span id="homeEndingCount" class="home-tab-count"></span></button>
            <button type="button" class="home-tab" data-soon="starting" id="homeTabStarting" role="tab" aria-selected="false" aria-controls="homeSoonList" tabindex="-1">곧 시작 <span id="homeStartingCount" class="home-tab-count"></span></button>
          </div>
          <span class="home-tabs-note">7일 안</span>
        </div>
        <div id="homeSoonList" role="tabpanel" aria-labelledby="homeTabEnding"></div>
      </section>
      <!-- 달별 행사: 다음 달부터 그 달에 시작하는 행사. 달 칩 "12월 · 14" 를 누르면 그 달 카드. 고를 행사가 없으면 숨김 -->
      <section id="homeMonths" class="home-months" aria-labelledby="homeMonthsTitle" hidden>
        <h2 id="homeMonthsTitle" class="home-section-title">달별 행사</h2>
        <div id="homeMonthChips" class="month-chips" role="group" aria-label="달 고르기"></div>
        <div id="homeMonthTrack" class="month-track"></div>
      </section>
      <!-- 내 주변: 구 칩 4개 + 작은 지도(그 구 행사 위치, 손으로 못 움직임) + "○○구 행사 N개 · 지도에서 보기" → 지도 탭 + 구 필터
           구 칩 · 작은 지도는 index.js 가 채움. 행사를 받기 전 · 실패하면 숨김 -->
      <section id="homeNearby" class="home-nearby" aria-labelledby="homeNearbyTitle" hidden>
        <h2 id="homeNearbyTitle" class="home-section-title">내 주변</h2>
        <div id="homeDistrictChips" class="home-districts" role="group" aria-label="구 고르기"></div>
        <div id="homeNearbyMap" class="nearby-map" aria-hidden="true"></div>
        <button type="button" id="homeNearbyGo" class="nearby-go"></button>
      </section>
    </section>
    <!-- 모바일 전용: 검색 화면 (디자인 06 입력 중). 홈 검색 버튼 · 지도 탭 검색창을 누르면 화면 전체를 덮음
         입력 중(06) 행은 글자만(사진 없음): [상태 배지] 제목(검색어 강조) … 구
         엔터 → 결과(07): "검색 결과 N개 · 종료 임박순" + 행사 행(포스터 · 배지 · D-day) + ♡ -->
    <section id="searchView" aria-label="행사 검색" hidden>
      <div class="search-head">
        <button type="button" id="searchBackBtn" class="icon-btn" aria-label="검색 닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <input type="search" id="searchViewInput" placeholder="행사 이름 · 장소 검색" enterkeyhint="search" autocomplete="off" aria-label="행사 이름 · 장소 검색" aria-controls="searchSuggest" />
        <button type="button" id="searchClearBtn" class="icon-btn" aria-label="검색어 지우기" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div id="searchSuggest" class="search-suggest"></div>
    </section>
    <!-- 모바일 전용: 하단 탭 (docs/design/mobile-design-v1.md 2번) -->
    <nav id="tabBar" aria-label="하단 탭">
      <button type="button" class="tab-item" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11 12 4l9 7" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" /></svg>
        <span>홈</span>
      </button>
      <button type="button" class="tab-item" data-tab="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" /><path d="M9 4v14M15 6v14" /></svg>
        <span>지도</span>
      </button>
      <button type="button" class="tab-item" data-tab="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        <span>목록</span>
      </button>
      <button type="button" class="tab-item" data-tab="fav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
        <span id="favTabDot" class="tab-dot" aria-hidden="true" hidden></span>
        <span>찜</span>
      </button>
      <a class="tab-item" data-tab="my" href="mypage.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg>
        <span>마이</span>
      </a>
    </nav>

    <!-- ===== 모바일 전용: 길찾기 창 (하단 시트) + 토스트 ===== -->
    <div id="routeSheet" hidden>
      <section class="route-sheet" role="dialog" aria-modal="true" aria-labelledby="routeTitle">
        <span class="sheet-handle" aria-hidden="true"></span>
        <div class="route-head">
          <h2 id="routeTitle">길찾기</h2>
          <button id="routeCloseBtn" type="button" class="icon-btn" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="route-place">
          <span id="routeEvent" class="route-event"></span>
          <span id="routePlace" class="route-name"></span>
          <div class="route-addr-row">
            <span id="routeAddress" class="route-addr"></span>
            <button id="routeCopyBtn" type="button" class="copy-btn">주소 복사</button>
          </div>
        </div>
        <div class="route-links">
          <a id="routeKakao" class="route-link" href="#" target="_blank" rel="noopener">
            <span class="route-icon" aria-hidden="true">K</span>
            <span class="route-link-text">카카오맵에서 길찾기</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <a id="routeNaver" class="route-link" href="#" target="_blank" rel="noopener">
            <span class="route-icon" aria-hidden="true">N</span>
            <span class="route-link-text">네이버 지도에서 길찾기</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <a id="routeGoogle" class="route-link google" href="#" target="_blank" rel="noopener">
            <span class="route-icon" aria-hidden="true">G</span>
            <span class="route-link-text">
              <span lang="en">Google Maps</span>
              <small>대중교통 길찾기만 지원 (도보·자동차 미지원)</small>
            </span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <span class="route-note">앱이 설치되어 있지 않으면 웹 지도가 열려요</span>
        </div>
        <div class="route-cancel">
          <button id="routeCancelBtn" type="button">취소</button>
        </div>
      </section>
    </div>
    <!-- 모바일 전용: 공유 창 (카카오톡으로 보내기 · 링크 복사) -->
    <div id="shareSheet" hidden>
      <section class="route-sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <span class="sheet-handle" aria-hidden="true"></span>
        <div class="route-head">
          <h2 id="shareTitle">공유</h2>
          <button id="shareCloseBtn" type="button" class="icon-btn" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="route-place">
          <span id="shareEvent" class="route-event"></span>
        </div>
        <div class="route-links">
          <button id="shareKakaoBtn" type="button" class="route-link">
            <span class="route-icon kakao" aria-hidden="true">K</span>
            <span class="route-link-text">카카오톡으로 보내기</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
          <button id="shareCopyBtn" type="button" class="route-link">
            <span class="route-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1" /><path d="M5 15V5a1 1 0 0 1 1-1h10" /></svg>
            </span>
            <span class="route-link-text">링크 복사</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>
        <div class="route-cancel">
          <button id="shareCancelBtn" type="button">취소</button>
        </div>
      </section>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toastText"></span>
      <button id="toastAction" type="button" hidden></button>
    </div>

    <!-- ===== 상세정보 큰 팝업창 ===== -->
    <div id="detailModal" class="modal-overlay">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="modalCloseBtn" class="modal-close" aria-label="닫기">×</button>
        <!-- 모바일 전용 상단: 뒤로 · 공유(하단 창) · ♡ -->
        <header id="detailHead">
          <button id="detailBackBtn" type="button" class="icon-btn" aria-label="뒤로">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <div class="head-actions">
            <button id="detailShareBtn" type="button" class="icon-btn" aria-label="공유">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path d="M8.6 10.7l6.8-4.4M8.6 13.3l6.8 4.4" /></svg>
            </button>
            <button id="detailHeadFav" type="button" class="icon-btn" aria-label="찜하기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg></button>
          </div>
        </header>
        <img id="modalImage" class="modal-image" src="" alt="" />
        <div class="modal-body">
          <div id="modalFavBadge" class="modal-fav-badge" hidden>★ 찜한 행사</div>
          <div id="modalDate" class="modal-date"></div>
          <div id="detailMeta"></div>
          <h2 id="modalTitle" class="modal-title"></h2>
          <div id="modalBadges"></div>
          <!-- 모바일 전용: 고정 탭 (정보 | 주변) + 정보 표 -->
          <div id="detailTabs" role="tablist" aria-label="상세 탭">
            <button type="button" class="detail-tab active" data-target="detailRows" role="tab" aria-selected="true">정보</button>
            <button type="button" class="detail-tab" data-target="detailLocation" role="tab" aria-selected="false">주변</button>
          </div>
          <div id="modalSchedule" class="modal-schedule"></div>
          <div id="modalInfo" class="modal-info"></div>
          <dl id="detailRows"></dl>
          <!-- 진행 날짜가 정해진 여러 날 행사 · 30일 넘는 긴 행사: 캘린더에 넣을 날짜 하나를 고름 -->
          <label id="modalCalDateWrap" class="modal-cal-date" hidden>
            캘린더에 넣을 날짜
            <select id="modalCalDate"></select>
          </label>
          <!-- 아이폰 외(PC · 안드로이드): 📅 은 구글 캘린더, 다른 캘린더 앱은 .ics 파일로 -->
          <a id="modalIcsAltLink" class="modal-ics-alt" href="#" hidden>다른 캘린더 앱에 넣기 (.ics 파일)</a>
          <div class="modal-actions">
            <button id="modalFavoriteBtn" class="favorite-btn">☆ 즐겨찾기</button>
            <a id="modalCalBtn" class="modal-link-btn" href="#">📅 캘린더</a>
            <a id="modalLinkBtn" class="modal-link-btn" href="#" target="_blank" rel="noopener">원문 보기 →</a>
          </div>
          <!-- 모바일 전용: 소개(3줄 + 더보기) · 위치(작은 지도 + 주소 복사) -->
          <section id="detailIntro" class="detail-section">
            <h3>소개</h3>
            <p id="detailIntroText"></p>
            <button id="detailIntroMore" type="button" aria-expanded="false" hidden>더보기</button>
          </section>
          <section id="detailLocation" class="detail-section">
            <h3>위치</h3>
            <div id="modalMap" aria-hidden="true"></div>
            <div class="route-addr-row">
              <span id="detailAddress" class="route-addr"></span>
              <button id="detailCopyBtn" type="button" class="copy-btn">주소 복사</button>
            </div>
          </section>
        </div>
        <!-- 모바일 전용 하단 고정: ♡ + 길찾기 -->
        <div id="detailBar">
          <button id="detailFavBtn" type="button" aria-label="찜하기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg></button>
          <button id="detailRouteBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2z" /></svg>길찾기
          </button>
        </div>
      </div>
    </div>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7e3b2a42df77bc183241db2bcc6c3cbb&autoload=false"></script>
    <!-- 카카오톡 공유용 JS SDK (지도와 같은 JavaScript 키로 Kakao.init). 못 불러오면 공유 창에서 안내만 -->

    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.9/kakao.min.js"
      integrity="sha384-JpLApTkB8lPskhVMhT+m5Ln8aHlnS0bsIexhaak0jOhAkMYedQoVghPfSpjNi9K1"
      crossorigin="anonymous"
    ></script>

    <script src="/favorite-ui.js"></script>

    <script src="/favorite-alerts.js"></script>
    <script src="/home-picks.js"></script>
    <script src="/nav-history.js"></script>

    <script src="/js/index.js"></script>
  </body>
