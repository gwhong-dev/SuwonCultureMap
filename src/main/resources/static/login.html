<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 - 수원 문화 프로그램 지도</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
      }

      .login-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        padding: 2.25rem 2rem;
        width: 320px;
        max-width: calc(100vw - 6rem); /* 폰에서 화면 밖으로 안 넘치게 (좌우 여백 1rem + 안쪽 여백 2rem씩) */
        text-align: center;
      }

      .login-card h1 {
        font-size: 1.2rem;
        margin: 0 0 1.5rem;
      }

      .social-btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 0.75rem;
        margin-bottom: 0.625rem;
        border-radius: 8px;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .social-btn.kakao {
        background: #fee500;
        color: #000;
      }
      .social-btn.google {
        background: #fff;
        color: #000;
        border: 1px solid #ddd;
      }
      .social-btn.naver {
        background: #03c75a;
        color: #fff;
      }

      .back-link {
        display: inline-block;
        margin-top: 1.125rem;
        font-size: 0.85rem;
        color: #888;
        text-decoration: none;
      }
      .login-error {
        margin: 0 0 1rem;
        padding: 0.625rem 0.75rem;
        border-radius: 8px;
        background: #fdecec;
        color: #b42318;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>소셜 계정으로 로그인</h1>

      <!-- 로그인 실패 안내 (서버가 /login.html?error=... 로 보냈을 때만 표시) -->
      <p id="loginError" class="login-error" hidden></p>

      <!-- ===== 소셜 로그인 버튼 3종 (서버의 /api/auth/{제공자}/login 으로 이동) ===== -->
      <a
        class="social-btn kakao"
        href="/api/auth/kakao/login"
        >카카오로 로그인</a
      >
      <a
        class="social-btn google"
        href="/api/auth/google/login"
        >구글로 로그인</a
      >
      <a
        class="social-btn naver"
        href="/api/auth/naver/login"
        >네이버로 로그인</a
      >

      <a class="back-link" href="index.html">← 지도로 돌아가기</a>
    </div>
    <script>
      // ?error=state     : 보안 확인(state) 실패 — 오래된 탭·다른 사이트에서 연 로그인 등
      // ?error=cancelled : 동의 화면에서 취소
      (function () {
        var messages = {
          state: "보안 확인에 실패했어요. 다시 로그인해 주세요.",
          cancelled: "로그인이 취소됐어요.",
        };
        var code = new URLSearchParams(location.search).get("error");
        if (code && messages[code]) {
          var el = document.getElementById("loginError");
          el.textContent = messages[code];
          el.hidden = false;
        }
      })();
    </script>
  </body>
</html>
