# =====================================================
#  공통 설정 (개발·운영 모두 적용) — 비밀값은 여기에 넣지 않음
# =====================================================
spring.application.name=festival

# 실행할 때 프로필을 안 정하면 dev(개발)로 실행
#   운영 서버에서는 환경변수 SPRING_PROFILES_ACTIVE=prod 로 덮어씀
spring.profiles.default=dev

server.port=${PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 정적 파일(static/ 의 HTML · JS · CSS) → Cache-Control: no-cache
#   브라우저가 캐시를 쓰기 전에 매번 서버에 확인 (안 바뀌었으면 304 로 본문 없이 응답 → 가벼움)
#   설정이 없으면 Last-Modified 로 캐시 시간을 추측해, 배포 직후 새 index.html + 옛 js/index.js 가 섞일 수 있음
#   주소에 해시를 붙이는 리소스 체인 버전은 정적 HTML 안 주소를 자동으로 못 바꿔서 쓰지 않음
spring.web.resources.cache.cachecontrol.no-cache=true

# OAuth 콜백 주소 = 사이트 주소 + 고정 경로
#   app.base-url 만 프로필별로 바꾸면 3개 콜백 주소가 같이 바뀜
# 탈퇴 때 카카오 연결 해제용 서비스 앱 어드민 키 (비밀값, 없으면 해제를 건너뛰고 경고)
kakao.admin-key=${KAKAO_ADMIN_KEY:}
kakao.redirect-uri=${app.base-url}/api/auth/kakao/callback
google.redirect-uri=${app.base-url}/api/auth/google/callback
naver.redirect-uri=${app.base-url}/api/auth/naver/callback

# 오시는 길 — 경기도 정류소 조회 API (data.go.kr 15080666, 인증키 Decoding). 비밀값, 비어 있어도 앱은 뜸 (docs/transit-directions.md)
gg.bus.service-key=${GG_BUS_SERVICE_KEY:}

# DB 구조는 Flyway 가 관리 (db/migration/V*.sql) → JPA 는 엔티티와 테이블이 맞는지 검사만
# 이미 테이블이 있는 DB(ddl-auto=update 시절에 만든 DB)는 처음 한 번 "버전 1"로 표시하고 V1 을 건너뜀
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate

# 요청 하나 동안 DB 세션을 열어 두지 않음 (open-in-view 끔, PR #35 리뷰 보류 항목)
#   켜 두면 인스타 게시물 하나가 롤백된 뒤에도 같은 세션을 계속 써서 다음 게시물이 꼬일 수 있음
#   지연 로딩(LAZY) 연관은 서비스의 @Transactional 안에서만 읽음 → OpenInViewOffApiTest 가 모든 API 로 확인
spring.jpa.open-in-view=false

# 인스타 게시물 → 행사 (토큰 · 내 계정 ID 는 비밀값이라 dev / 환경변수에. 비어 있으면 수집 안 함)
#  - sync.enabled: 수집 · 표시 스위치. false 면 Meta API 호출 없음 + 인스타 행사를 내보내지 않음 (저장된 행은 그대로)
#    운영 서버 .env 에서만 true. 대상은 수원시 · 문화기관 공식 계정만 → docs/decisions/2026-11-02-instagram-resume-official.md
#  - accounts: 대상 프로페셔널 계정 이름, 쉼표로 여러 개. 코드의 공식 계정 목록(OfficialInstagramAccounts) 밖은 건너뜀
instagram.sync.enabled=${INSTAGRAM_SYNC_ENABLED:false}
#  - fetch-limit: 계정마다 가져올 최근 게시물 수 (1~25, 호출 제한 대비 작게 시작)
instagram.accounts=${INSTAGRAM_ACCOUNTS:suwon_city}
instagram.fetch-limit=${INSTAGRAM_FETCH_LIMIT:10}
# 블록마다 한 줄씩 결과(상태 · 제목 · 날짜 · 장소 · 이유)를 로그로 남김. 조용히 하려면 아래 줄 주석을 풀기
# logging.level.com.suwon.festival.instagram.blocks=WARN

# 헬스체크: /actuator/health 만 공개, 결과는 UP/DOWN 만 (DB 연결 · 디스크 상세는 숨김)
#  - 배포 스크립트(deploy/deploy.sh) · CI 가 앱 기동 확인에 사용. 다른 actuator 엔드포인트는 열지 않음
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# /actuator 목록 페이지도 닫음
management.endpoints.web.discovery.enabled=false
# 쿠버네티스용 liveness · readiness 그룹은 쓰지 않음 (Docker Compose 운영)
management.endpoint.health.probes.enabled=false
