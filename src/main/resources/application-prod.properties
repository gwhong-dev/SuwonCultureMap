# =====================================================
#  운영(prod) 설정 — 실제 값은 전부 서버의 "환경변수"에서 읽음
#  이 파일에는 비밀값이 없으므로 Git에 올려도 안전
# =====================================================

# 실제 서비스 주소 (예: https://suwon-culture-map.com)
app.base-url=${APP_BASE_URL}

# 로그인 세션 쿠키: HTTPS 로만 전송, 스크립트 접근 차단, 다른 사이트에서 보내는 요청 제한 (소셜 로그인 복귀는 허용되는 Lax)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# HSTS: 브라우저가 1년 동안 이 도메인을 HTTPS 로만 접속 (SecurityHeadersFilter). 로컬 · 테스트는 http 라 끔
app.security.hsts=true

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 테이블 생성 · 변경은 Flyway (공통 설정 application.properties 의 ddl-auto=validate 를 그대로 씀)
# 운영에선 SQL 로그 끔 (로그가 너무 많아짐)
spring.jpa.show-sql=false

# 파일 로그: 위치는 docker-compose.prod.yml 의 LOGGING_FILE_NAME (없으면 화면에만 출력)
#   날짜가 바뀌거나 10MB 를 넘으면 .gz 로 압축해 넘김, 14일 · 합계 100MB 까지만 보관 (넘으면 오래된 것부터 삭제)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB

# 재단 → 인스타 → 합치기 자동 실행 (기본 매일 06시 · 18시, 한국 시간). 운영에선 수동 동기화 API 가 없음
app.sync.enabled=true
app.sync.cron=${APP_SYNC_CRON:0 0 6,18 * * *}

# 수원문화재단 API
swcf.api.key.event=${SWCF_API_KEY_EVENT}

# 카카오
kakao.rest-api-key=${KAKAO_REST_API_KEY}
kakao.client-secret=${KAKAO_CLIENT_SECRET}

# 구글
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}

# 네이버
naver.client-id=${NAVER_CLIENT_ID}
naver.client-secret=${NAVER_CLIENT_SECRET}

# 인스타그램 게시물 수집 (Business Discovery). 비어 있으면 수집하지 않음
instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
instagram.user-id=${INSTAGRAM_USER_ID:}
instagram.token-expires-at=${INSTAGRAM_TOKEN_EXPIRES_AT:}
# 인스타 행사 사진 저장 폴더 (docker-compose.prod.yml 의 insta-images 볼륨). 비면 사진을 받지 않음 (docs/instagram-images.md)
instagram.image-dir=${INSTAGRAM_IMAGE_DIR:}
