# =====================================================
#  CI — PR 을 올리거나 main 에 머지될 때마다 자동 실행
#  1) build-test  : 컴파일 + 테스트 (H2 메모리 DB, 비밀값 없이)
#  2) docker-build: Dockerfile 로 이미지가 실제로 만들어지는지
# =====================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 빌드 + 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven   # 라이브러리 캐시 → 두 번째부터 빨라짐

      - name: 컴파일 + 테스트
        run: ./mvnw -B -ntp verify

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t suwonculturemap-app:ci .
