# =====================================================
#  CI — PR 을 올리거나 main 에 머지될 때마다 자동 실행
#  1) build-test  : 컴파일 + 테스트 (H2 메모리 DB, 비밀값 없이)
#  2) docker-build: Dockerfile 로 이미지가 실제로 만들어지는지
# =====================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 빌드 + 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven   # 라이브러리 캐시 → 두 번째부터 빨라짐

      - name: 화면 표시 규칙 시험
        run: node --test src/test/js/schedule-format.test.js

      - name: 컴파일 + 테스트
        run: ./mvnw -B -ntp verify

      # 테스트 개수를 PR 화면(Checks 요약·주석)에 남김 → 로그를 안 열어도 몇 개 돌았는지 확인 가능
      - name: 테스트 결과 요약
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for x in glob.glob("target/surefire-reports/TEST-*.xml"):
              r = ET.parse(x).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          line = f"Tests run: {t}, Failures: {f}, Errors: {e}, Skipped: {s}"
          print(f"::notice title=테스트 결과::{line}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"### 🧪 {line}\n")
          PY

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t suwonculturemap-app:ci .

  deploy-check:
    name: 배포 파일 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 가짜 값으로 .env 만들기
        run: |
          cat > .env <<'EOF'
          SITE_DOMAIN=example.com
          APP_BASE_URL=https://example.com
          DB_USERNAME=ci
          DB_PASSWORD=ci-password
          MYSQL_ROOT_PASSWORD=ci-root-password
          SWCF_API_KEY_EVENT=x
          KAKAO_REST_API_KEY=x
          KAKAO_ADMIN_KEY=x
          KAKAO_CLIENT_SECRET=x
          GOOGLE_CLIENT_ID=x
          GOOGLE_CLIENT_SECRET=x
          NAVER_CLIENT_ID=x
          NAVER_CLIENT_SECRET=x
          EOF

      - name: compose 설정 · 스크립트 문법
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          bash -n deploy/setup-server.sh
          bash -n deploy/backup-db.sh
          bash -n deploy/deploy.sh

      - name: Caddyfile 검사
        run: >
          docker run --rm -e SITE_DOMAIN=example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # H2 테스트로는 못 보는 것: 빈 MySQL 위의 Flyway · ddl-auto=validate · prod 프로필 설정
      # 빈 DB 에서 먼저 실행 (표가 있으면 Flyway 가 기존 DB 로 보고 V1 을 건너뜀)
      - name: 앱 실행 후 문서 절차대로 백업 · 복원
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          sql() { $COMPOSE exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -uroot -N "$@"' sh "$@"; }
          wait_app() {
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null http://127.0.0.1:8080/api/events; then
                echo "앱 응답 확인"
                return 0
              fi
              sleep 5
            done
            # 앱이 재시작을 반복하면 첫 오류가 앞쪽에 있으므로 처음부터 출력 (자바 호출 경로 줄 제외)
            $COMPOSE logs --no-color app | grep -v -E '^\S+\s+\|\s+(at |\.\.\. )' | head -n 120 || true
            return 1
          }

          $COMPOSE up -d --build db app
          wait_app

          COUNT_SQL='SELECT COUNT(*) FROM suwon_culture_map.flyway_schema_history WHERE success = 1;'
          BEFORE="$(sql -e "$COUNT_SQL")"
          test "$BEFORE" -ge 4
          BACKUP_DIR="$PWD/ci-backups" bash deploy/backup-db.sh

          $COMPOSE stop app
          sql -e "DROP DATABASE suwon_culture_map;"
          gzip -dc ci-backups/db-*.sql.gz | sql
          test "$(sql -e "$COUNT_SQL")" = "$BEFORE"
          $COMPOSE start app
          wait_app
