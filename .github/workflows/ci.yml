# =====================================================
#  CI — PR 을 올리거나 main 에 머지될 때마다 자동 실행
#  1) build-test  : 컴파일 + 테스트 (H2 메모리 DB, 비밀값 없이)
#  2) docker-build: Dockerfile 로 이미지가 실제로 만들어지는지
# =====================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 빌드 + 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven   # 라이브러리 캐시 → 두 번째부터 빨라짐

      - name: 컴파일 + 테스트
        run: ./mvnw -B -ntp verify

      # 테스트 개수를 PR 화면(Checks 요약·주석)에 남김 → 로그를 안 열어도 몇 개 돌았는지 확인 가능
      - name: 테스트 결과 요약
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for x in glob.glob("target/surefire-reports/TEST-*.xml"):
              r = ET.parse(x).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          line = f"Tests run: {t}, Failures: {f}, Errors: {e}, Skipped: {s}"
          print(f"::notice title=테스트 결과::{line}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"### 🧪 {line}\n")
          PY

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t suwonculturemap-app:ci .
