# =====================================================
#  CD — main 의 CI 가 통과하면 운영 서버(EC2)에 자동 배포
#  GitHub → (OIDC 임시 권한) → AWS SSM → 서버에서 deploy/deploy.sh 실행
#  - 서버 22번 포트를 더 열지 않음, GitHub 에 AWS 키 · SSH 키를 저장하지 않음
#  - 설정 방법: docs/deploy-ec2.md "자동 배포"
#  - 저장소 변수(AWS_DEPLOY_ROLE_ARN · EC2_INSTANCE_ID)가 없으면 건너뜀
# =====================================================
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # Actions 화면에서 수동 재배포

permissions:
  id-token: write # AWS 임시 권한(OIDC) 발급용
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # 배포 도중 끊지 않음, 다음 배포는 기다림

jobs:
  deploy:
    name: 운영 서버 배포
    runs-on: ubuntu-latest
    # main 에 push(머지)된 CI 가 성공했을 때만. PR 의 CI 로는 배포하지 않음
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ubuntu/SuwonCultureMap' }}
      # CI 가 통과한 바로 그 커밋 (그 사이 main 에 더 머지돼도 아직 검사 안 된 커밋은 배포하지 않음)
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: AWS 임시 권한 받기
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 서버에서 배포 실행 (SSM)
        run: |
          # 배포할 커밋의 deploy.sh 를 임시 파일로 꺼내 실행 (실행 중 파일이 바뀌는 문제 방지)
          RUN=".git/suwon-deploy.sh"
          SCRIPT="set -e; cd '$DEPLOY_DIR'; git fetch -q origin main; git show '$TARGET_SHA':deploy/deploy.sh > $RUN; bash $RUN '$DEPLOY_DIR' '$TARGET_SHA'"
          PARAMS="$(jq -cn --arg cmd "sudo -u ubuntu -H bash -c \"$SCRIPT\"" '{commands: [$cmd], executionTimeout: ["1500"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TARGET_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)"
          echo "SSM 명령 ID: $COMMAND_ID"

          # 빌드에 몇 분 걸림 → 최대 25분 기다림
          STATUS=Pending
          for i in $(seq 1 150); do
            sleep 10
            if ! OUT="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>&1)"; then
              # 보낸 직후엔 결과가 아직 없음 → 기다림. 권한 오류 등은 바로 실패
              case "$OUT" in *InvocationDoesNotExist*) continue ;; esac
              echo "::error title=결과 조회 실패::$OUT"
              exit 1
            fi
            STATUS="$OUT"
            case "$STATUS" in Pending|InProgress|Delayed|Cancelling) continue ;; *) break ;; esac
          done
          case "$STATUS" in
            Pending|InProgress|Delayed|Cancelling)
              echo "::warning title=25분 초과::서버에서 아직 실행 중일 수 있음 — Systems Manager → Run Command 에서 $COMMAND_ID 확인" ;;
          esac

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- 서버 오류 출력 -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          echo "### 🚀 배포 결과: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "Success" ]; then
            echo "::error title=배포 실패::SSM 상태 $STATUS — 위 서버 출력 확인"
            exit 1
          fi

      - name: 외부에서 사이트 응답 확인
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null --max-time 10 https://suwonbible.com/api/events; then
              echo "https://suwonbible.com 응답 확인"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=사이트 응답 없음::서버 배포는 끝났지만 https://suwonbible.com/api/events 가 응답하지 않음"
          exit 1
