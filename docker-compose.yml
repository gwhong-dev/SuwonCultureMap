# =====================================================
#  docker compose up --build  → 앱 + MySQL 을 한 번에 실행
#  비밀값은 같은 폴더의 .env 에서 읽음 (Git 제외)
#  .env 는 scripts\setup-docker.cmd 가 application-dev.properties 를 보고 자동 생성
# =====================================================
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-suwon_culture_map}
      MYSQL_USER: ${DB_USERNAME:?.env 에 DB_USERNAME 이 없음 - scripts\setup-docker.cmd 실행}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 가 없음}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 가 없음}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # Workbench 접속용 (앱 동작엔 불필요). 이 컴퓨터 안에서만 접속 가능, 3307 이 사용 중이면 .env 에 DB_PORT=3308 처럼 변경
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql   # 컨테이너를 지워도 데이터는 유지
    healthcheck:
      # 127.0.0.1(TCP)로 확인 → 첫 기동 때 잠깐 뜨는 임시 서버(네트워크 꺼짐)에 속지 않음
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: on-failure   # DB가 늦게 준비돼 접속에 실패하면 자동으로 다시 시작
    depends_on:
      db:
        condition: service_healthy   # MySQL 이 준비된 뒤에 앱 시작
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # useSSL=false: 앱 → DB 는 Docker 내부 네트워크 안에서만 통신 (외부 공개 안 함)
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-suwon_culture_map}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SWCF_API_KEY_EVENT: ${SWCF_API_KEY_EVENT:?.env 에 SWCF_API_KEY_EVENT 가 없음}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?.env 에 KAKAO_REST_API_KEY 가 없음}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?.env 에 KAKAO_CLIENT_SECRET 가 없음}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?.env 에 GOOGLE_CLIENT_ID 가 없음}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?.env 에 GOOGLE_CLIENT_SECRET 가 없음}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?.env 에 NAVER_CLIENT_ID 가 없음}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?.env 에 NAVER_CLIENT_SECRET 가 없음}
      # 인스타 수집 (선택). 스위치가 false 면 토큰이 있어도 수집 · 표시하지 않음
      INSTAGRAM_SYNC_ENABLED: ${INSTAGRAM_SYNC_ENABLED:-false}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_TOKEN_EXPIRES_AT: ${INSTAGRAM_TOKEN_EXPIRES_AT:-}
      INSTAGRAM_ACCOUNTS: ${INSTAGRAM_ACCOUNTS:-suwon_city}
      # 오시는 길 — 경기도 정류소 조회 API 키 (선택, 없으면 정류소 칸을 숨김)
      GG_BUS_SERVICE_KEY: ${GG_BUS_SERVICE_KEY:-}
      # 자동 동기화 시각 (초 분 시 일 월 요일, 한국 시간)
      APP_SYNC_CRON: ${APP_SYNC_CRON:-0 0 6,18 * * *}
    ports:
      # 이 컴퓨터 안에서만 접속 가능. 운영에서는 HTTPS 프록시가 외부 요청을 받아 넘겨줌
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
