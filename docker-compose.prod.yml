# =====================================================
#  운영 서버 전용 덧붙임 — docker-compose.yml 위에 겹쳐서 실행
#  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#  - caddy: 80 · 443 을 받아 HTTPS 인증서를 자동 발급 · 갱신하고 앱으로 넘김
#  - 앱 · DB 는 외부에 열지 않음 (docker-compose.yml 에서 127.0.0.1 에만 연결)
# =====================================================
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    restart: unless-stopped   # 서버를 재시작해도 자동으로 다시 시작
    logging: *logging

  app:
    restart: unless-stopped
    logging: *logging
    environment:
      # 2GB 서버에서 MySQL 과 메모리를 나눠 쓰도록 앱 메모리 상한을 둠
      JAVA_TOOL_OPTIONS: -Xmx700m

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?.env 에 SITE_DOMAIN 이 없음}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 인증서 보관 (지우면 다시 발급받음)
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
