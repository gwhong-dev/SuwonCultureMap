# =====================================================
#  운영 서버 전용 덧붙임 — docker-compose.yml 위에 겹쳐서 실행
#  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#  - caddy: 80 · 443 을 받아 HTTPS 인증서를 자동 발급 · 갱신하고 앱으로 넘김
#  - 앱 · DB 는 외부에 열지 않음 (docker-compose.yml 에서 127.0.0.1 에만 연결)
#  - 앱 로그는 docker logs(배포로 컨테이너를 새로 만들면 사라짐)와 별도로 app-logs 볼륨에 날짜별 파일로 남김
#  - 인스타 행사 사진은 insta-images 볼륨 (배포해도 남음)
# =====================================================
# 화면 출력 로그(docker logs): json-file 은 기간 제한 옵션이 없어 용량으로만 지움 (10MB × 3 = 서비스별 30MB)
#  → 값을 바꾸면 privacy.html "접속 기록" 문구도 함께 (PrivacyPolicyPageTest 가 확인)
#  → 배포(up -d --build)는 바뀐 서비스(보통 app)만 새로 만들므로 db · caddy 로그는 배포로 지워지지 않음
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    restart: unless-stopped   # 서버를 재시작해도 자동으로 다시 시작
    logging: *logging
    # --skip-log-bin: 변경 기록(기본 30일 보관)을 남기지 않음 → 탈퇴 회원 값이 처리방침의 보관 기간을 넘겨 남지 않게
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-log-bin"]

  app:
    restart: unless-stopped
    logging: *logging
    environment:
      # 빠지면 소셜 로그인 복귀 주소와 탈퇴 때 카카오 연결 해제가 동작하지 않으므로 운영에선 필수
      APP_BASE_URL: ${APP_BASE_URL:?.env 에 APP_BASE_URL 이 없음}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:?.env 에 KAKAO_ADMIN_KEY 가 없음}
      # 오시는 길 — 경기도 정류소 조회 API 키 (선택)
      GG_BUS_SERVICE_KEY: ${GG_BUS_SERVICE_KEY:-}
      # 2GB 서버에서 MySQL 과 메모리를 나눠 쓰도록 앱 메모리 상한을 둠
      JAVA_TOOL_OPTIONS: -Xmx700m
      # 파일 로그 위치 (보관 기간 · 용량은 application-prod.properties)
      LOGGING_FILE_NAME: /app/logs/app.log
      # 인스타 행사 사진 저장 폴더 (docs/instagram-images.md). 행사가 지워지면 다음 동기화 끝에 파일도 지움
      INSTAGRAM_IMAGE_DIR: /app/images
    volumes:
      - app-logs:/app/logs     # 배포해도 지난 로그가 남음
      - insta-images:/app/images   # 인스타 행사 사진 (만료되는 원래 주소 대신 우리 주소로 내보냄)

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?.env 에 SITE_DOMAIN 이 없음}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 인증서 보관 (지우면 다시 발급받음)
      - caddy-config:/config

volumes:
  app-logs:
  insta-images:
  caddy-data:
  caddy-config:
