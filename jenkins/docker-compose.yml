# =====================================================
#  내 PC 용 Jenkins — scripts\jenkins-start.cmd 로 실행 → http://localhost:8081
#  - 8081: 앱(8080)과 겹치지 않게. 127.0.0.1 → 이 PC 안에서만 접속
#  - jenkins_home 볼륨: 설정 · 빌드 기록 · Maven 캐시 보관 (컨테이너를 지워도 남음)
#  - docker.sock: Jenkins 안에서 PC 의 Docker 로 이미지 빌드
# =====================================================
name: suwon-jenkins

services:
  jenkins:
    build: .
    image: suwon-jenkins:local
    # docker.sock 권한 때문에 root 로 실행 (이 PC 안에서만 쓰는 학습용, 외부 공개 안 함)
    user: root
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?jenkins/.env 에 JENKINS_ADMIN_PASSWORD 가 없음 - scripts\jenkins-start.cmd 로 실행}
      TZ: Asia/Seoul
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"   # 필요할 때만 켬 (PC 켤 때 자동 시작 안 함)

volumes:
  jenkins-home:
